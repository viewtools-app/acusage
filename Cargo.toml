[package]
name = "acusage"
version = "0.5.0"
edition = "2024"
license = "MIT"
description = "AI coding usage: read-only usage report for Claude Code, Codex, Antigravity and Gemini CLI logs"
homepage = "https://acusage.viewtools.app"
repository = "https://github.com/viewtools-app/acusage"
readme = "README.md"
keywords = ["claude", "codex", "gemini", "tokens", "usage"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.2"
walkdir = "2"

[dev-dependencies]
tempfile = "3"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
